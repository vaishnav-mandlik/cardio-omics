[project]
name = "cardioomics"
version = "0.1.0"
description = "Heart-failure multi-omics pipeline: RNA-seq + proteomics integration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vaishnav Mandlik" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "pydeseq2>=0.5",
    "gseapy>=1.1",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "joblib>=1.4",
]

[project.optional-dependencies]
workflow = [
    "snakemake>=9.0",
    "snakemake-executor-plugin-slurm>=1.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
cardioomics = "cardioomics.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardioomics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end workflow tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/cardioomics/cli.py" = ["B008"]
"src/cardioomics/plots.py" = ["E402"]
